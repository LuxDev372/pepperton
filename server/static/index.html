<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pepperton — Observatory</title>
<style>
  :root {
    --bg: #14161c;
    --panel: #1a1e26;
    --panel2: #202631;
    --line: #2b3340;
    --ink: #dfe5ec;
    --ink-dim: #8a93a0;
    --ink-dimmer: #5c6572;
    --accent: #e0a458;
    --violet: #b58fd8;
    --teal: #6fb3a8;
    --danger: #d87f7f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---------------- header ---------------- */
  header {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 10px 18px;
    background: #10131a;
    border-bottom: 1px solid var(--line);
    flex: 0 0 auto;
  }
  header h1 {
    font-size: 17px;
    letter-spacing: 4px;
    font-weight: 700;
    color: var(--accent);
  }
  #clock {
    font-size: 22px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }
  #clock.paused { color: var(--ink-dim); }
  #daynight { font-size: 20px; line-height: 1; filter: saturate(0.8); }
  .badge {
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 10px;
    border: 1px solid var(--line);
    color: var(--ink-dim);
    letter-spacing: 1px;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .badge.mock { color: var(--accent); border-color: #574327; }
  .badge.live { color: var(--teal); border-color: #2c4a44; }
  #conn { display: inline-flex; align-items: center; gap: 6px; }
  #conn::before {
    content: "";
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--danger);
    display: inline-block;
  }
  #conn.ok::before { background: var(--teal); }
  header .spacer { flex: 1; }
  #pauseBtn {
    background: var(--panel2);
    border: 1px solid var(--line);
    color: var(--ink);
    font: inherit;
    font-size: 13px;
    padding: 6px 16px;
    border-radius: 8px;
    cursor: pointer;
  }
  #pauseBtn:hover { border-color: var(--accent); color: var(--accent); }
  #pauseBtn.paused { border-color: var(--accent); color: var(--accent); }

  /* ---------------- main layout ---------------- */
  main { flex: 1; display: flex; min-height: 0; }
  #mapwrap { flex: 0 0 65%; position: relative; min-width: 0; }
  #map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: default; }

  #right {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    border-left: 1px solid var(--line);
    position: relative;
    background: var(--panel);
  }
  #feedhead {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--ink-dim);
  }
  #pinBtn {
    background: none;
    border: 1px solid var(--line);
    color: var(--ink-dim);
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 6px;
    cursor: pointer;
  }
  #pinBtn.on { color: var(--accent); border-color: #574327; }
  #feed {
    flex: 1;
    overflow-y: auto;
    padding: 10px 12px 16px;
    font-size: 13px;
    line-height: 1.5;
    scrollbar-width: thin;
    scrollbar-color: #333c49 transparent;
  }
  .ev { margin-bottom: 4px; word-wrap: break-word; }
  .ev .t { color: var(--ink-dimmer); font-size: 11px; font-variant-numeric: tabular-nums; margin-right: 6px; }
  .ev .who { font-weight: 600; }
  .ev.say { color: #eef2f7; }
  .ev.say .who { color: #fff; }
  .ev.radio { color: var(--accent); }
  .ev.radio .who { color: var(--accent); }
  .ev.action { color: var(--ink-dim); font-style: italic; }
  .ev.arrive, .ev.leave { color: var(--ink-dimmer); font-size: 12px; }
  .ev.reflect { color: var(--violet); font-style: italic; }
  .ev.world { color: var(--teal); }

  /* ---------------- inspector ---------------- */
  #inspector {
    position: absolute;
    inset: 0;
    background: #161a22;
    display: none;
    flex-direction: column;
    z-index: 10;
  }
  #inspector.open { display: flex; }
  #insphead {
    flex: 0 0 auto;
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 12px 14px 8px;
    border-bottom: 1px solid var(--line);
  }
  #insphead h2 { font-size: 17px; }
  #inspClose {
    margin-left: auto;
    background: none;
    border: 1px solid var(--line);
    color: var(--ink-dim);
    font-size: 13px;
    width: 26px; height: 26px;
    border-radius: 7px;
    cursor: pointer;
    align-self: center;
  }
  #inspClose:hover { color: var(--ink); border-color: var(--ink-dim); }
  #inspbody { flex: 1; overflow-y: auto; padding: 12px 14px 24px; font-size: 13px; scrollbar-width: thin; scrollbar-color: #333c49 transparent; }
  .kv { margin-bottom: 10px; color: var(--ink-dim); }
  .kv b { color: var(--ink); font-weight: 600; }
  .tagrow { display: flex; flex-wrap: wrap; gap: 5px; margin: 6px 0 12px; }
  .tag {
    font-size: 11px; padding: 2px 8px; border-radius: 9px;
    background: var(--panel2); border: 1px solid var(--line); color: var(--ink-dim);
  }
  .tag.model { color: var(--teal); border-color: #2c4a44; }
  .tag.possessed { color: var(--danger); border-color: #5a3232; }
  .sect { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--ink-dimmer); margin: 14px 0 6px; }
  .needbar { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  .needbar .nlabel { width: 62px; color: var(--ink-dim); font-size: 12px; }
  .needbar .track { flex: 1; height: 7px; background: #2a313c; border-radius: 4px; overflow: hidden; }
  .needbar .fill { height: 100%; border-radius: 4px; }
  .needbar .nval { width: 34px; text-align: right; font-size: 11px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
  .rel { display: flex; justify-content: space-between; padding: 2px 0; color: var(--ink-dim); }
  .rel b { color: var(--ink); font-weight: 500; }
  .mem { margin: 5px 0; padding: 6px 8px; background: var(--panel2); border-radius: 7px; font-size: 12px; color: var(--ink-dim); }
  .mem .mk { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; margin-right: 6px; }
  .mem .mk.reflect { color: var(--violet); }
  .mem .mk.say, .mem .mk.heard { color: #cfd6de; }
  .mem .mk.radio { color: var(--accent); }
  .mem .imp { float: right; color: var(--ink-dimmer); font-size: 10px; }
  details { margin: 8px 0; border: 1px solid var(--line); border-radius: 8px; }
  details summary { cursor: pointer; padding: 7px 10px; font-size: 12px; color: var(--ink-dim); user-select: none; }
  details[open] summary { border-bottom: 1px solid var(--line); }
  details pre {
    max-height: 240px;
    overflow: auto;
    padding: 10px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 11px;
    line-height: 1.45;
    white-space: pre-wrap;
    word-break: break-word;
    color: #b7c0cb;
    scrollbar-width: thin;
  }
  #waiting {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--ink-dimmer); font-size: 14px; letter-spacing: 2px; pointer-events: none;
  }
.ev.text { color: #7fd4c1; }
.ev.gossip { color: #d8a5c8; font-weight: 500; }
</style>
</head>
<body>

<header>
  <h1>PEPPERTON</h1>
  <span id="daynight">☀️</span>
  <span id="clock">— · —</span>
  <span id="modebadge" class="badge">…</span>
  <span id="seedbadge" class="badge">seed —</span>
  <span id="conn" class="badge">offline</span>
  <span class="spacer"></span>
  <button id="pauseBtn">Pause</button>
</header>

<main>
  <div id="mapwrap">
    <canvas id="map"></canvas>
    <div id="waiting">waiting for the town to wake up…</div>
  </div>
  <div id="right">
    <div id="feedhead">
      <span>Town transcript</span>
      <button id="pinBtn" class="on" title="Auto-scroll to newest">pinned ▾</button>
    </div>
    <div id="feed"></div>
    <div id="inspector">
      <div id="insphead">
        <h2 id="inspName">—</h2>
        <span id="inspJob" style="color:var(--ink-dim);font-size:13px"></span>
        <button id="inspClose" title="Close">✕</button>
      </div>
      <div id="inspbody"></div>
    </div>
  </div>
</main>

<script>
"use strict";

/* =====================================================================
   STATE
===================================================================== */
const W = 1000, H = 700;          // virtual map coordinates
const state = {
  snap: null,                     // last snapshot
  events: [],                     // accumulated events (last ~300)
  lastSeq: 0,
  layout: null,                   // name -> {x,y,w,h,isHome,label,radio}
  layoutSig: "",
  agents: new Map(),              // name -> dot {x,y,tx,ty,sx,sy,t0,hue,loc,asleep}
  bubbles: [],                    // {agent?|loc?, lines, born, radio}
  pinned: true,
  feedHover: false,
  insp: { open: false, name: null, timer: null },
};

/* =====================================================================
   HELPERS
===================================================================== */
const $ = (id) => document.getElementById(id);
function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function hashHue(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
  return h % 360;
}
function firstName(n) { return String(n || "").split(" ")[0]; }
function easeInOut(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
function rr(ctx, x, y, w, h, r) {   // rounded rect path
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* =====================================================================
   LAYOUT — hand-placed public spots, homes along the bottom
===================================================================== */
const FIXED_SPOTS = {
  "the plaza":     [385, 255, 230, 160],
  "rosie's diner": [ 70,  60, 240, 150],
  "pepper & sons": [700,  60, 235, 150],
  "the park":      [ 60, 290, 240, 170],
  "the library":   [700, 290, 235, 150],
  "the workshop":  [395,  50, 210, 120],
  "the rusty tap": [385, 450, 230, 106],
};
const EXTRA_SLOTS = [
  [ 75, 480, 185, 90], [655, 480, 185, 90], [ 75, 175, 185, 90], [945-185, 175, 185, 90],
];

function buildLayout(locations) {
  const layout = {};
  const homes = [], extras = [];
  let extraIdx = 0;
  for (const loc of locations) {
    if (loc.home_of || loc.vacant) { homes.push(loc); continue; }
    const spot = FIXED_SPOTS[loc.name.toLowerCase()];
    if (spot) {
      layout[loc.name] = { x: spot[0], y: spot[1], w: spot[2], h: spot[3],
                           isHome: false, label: loc.name, radio: loc.radio };
    } else {
      extras.push(loc);
    }
  }
  for (const loc of extras) {
    const s = EXTRA_SLOTS[extraIdx % EXTRA_SLOTS.length];
    const bump = Math.floor(extraIdx / EXTRA_SLOTS.length) * 14;
    layout[loc.name] = { x: s[0] + bump, y: s[1] - bump, w: s[2], h: s[3],
                         isHome: false, label: loc.name, radio: loc.radio };
    extraIdx++;
  }
  // homes: cottages along the bottom edge — auto-shrink, wrap when crowded
  const n = homes.length;
  if (n > 0) {
    const perRow = n > 10 ? Math.ceil(n / 2) : n;
    const rows = Math.ceil(n / perRow);
    const gap = n > 7 ? 10 : 18, margin = 30;
    const rowH = rows > 1 ? 74 : 96;
    let i = 0;
    for (let r = 0; r < rows; r++) {
      const rowLocs = homes.slice(r * perRow, (r + 1) * perRow);
      const m = rowLocs.length;
      const cw = Math.max(56, Math.min(155, (W - 2 * margin - (m - 1) * gap) / m));
      const total = m * cw + (m - 1) * gap;
      let x = (W - total) / 2;
      const y = 565 + (rows > 1 ? (r - (rows - 1)) * (rowH + 12) + (rows - 1) * 22 : 0);
      for (const loc of rowLocs) {
        layout[loc.name] = { x, y, w: cw, h: rowH, isHome: true,
                             label: loc.home_of ? firstName(loc.home_of) + "’s"
                                                : "— vacant —",
                             radio: loc.radio, owner: loc.home_of };
        x += cw + gap;
        i++;
      }
    }
  }
  return layout;
}
function layoutSignature(locations) {
  return locations.map((l) => l.name + "|" + (l.home_of || "") + (l.vacant ? "|v" : "")).join(";");
}

/* =====================================================================
   AGENT DOTS — slots inside buildings, 600ms tweened movement
===================================================================== */
function slotInBuilding(b, idx, count) {
  const padX = 18, topPad = 30, botPad = 16;
  const iw = Math.max(10, b.w - 2 * padX);
  const ih = Math.max(10, b.h - topPad - botPad);
  const cols = Math.max(1, Math.ceil(Math.sqrt(count)));
  const rows = Math.max(1, Math.ceil(count / cols));
  const c = idx % cols, r = Math.floor(idx / cols);
  return {
    x: b.x + padX + (c + 0.5) * (iw / cols),
    y: b.y + topPad + (r + 0.5) * (ih / rows),
  };
}

function updateAgentTargets(snap) {
  const byLoc = {};
  for (const a of snap.agents) (byLoc[a.location] = byLoc[a.location] || []).push(a);
  const now = performance.now();
  for (const locName in byLoc) {
    const group = byLoc[locName].slice().sort((p, q) => p.name.localeCompare(q.name));
    const b = state.layout[locName];
    group.forEach((a, i) => {
      const slot = b ? slotInBuilding(b, i, group.length)
                     : { x: W / 2, y: H / 2 };
      let dot = state.agents.get(a.name);
      if (!dot) {
        dot = { x: slot.x, y: slot.y, tx: slot.x, ty: slot.y,
                sx: slot.x, sy: slot.y, t0: now - 1000,
                hue: hashHue(a.name), loc: a.location };
        state.agents.set(a.name, dot);
      }
      if (Math.abs(dot.tx - slot.x) > 0.5 || Math.abs(dot.ty - slot.y) > 0.5) {
        dot.sx = dot.x; dot.sy = dot.y;
        dot.tx = slot.x; dot.ty = slot.y;
        dot.t0 = now;
      }
      dot.loc = a.location;
      dot.asleep = !!a.asleep;
      dot.job = a.job;
      dot.activity = a.activity;
    });
  }
  // drop dots for agents no longer present
  const names = new Set(snap.agents.map((a) => a.name));
  for (const k of state.agents.keys()) if (!names.has(k)) state.agents.delete(k);
}

function tickAgentPositions(now) {
  for (const dot of state.agents.values()) {
    const t = Math.min(1, (now - dot.t0) / 600);
    const e = easeInOut(t);
    dot.x = dot.sx + (dot.tx - dot.sx) * e;
    dot.y = dot.sy + (dot.ty - dot.sy) * e;
  }
}

/* =====================================================================
   SPEECH BUBBLES
===================================================================== */
const BUBBLE_LIFE = 6000, BUBBLE_FADE = 1200;
let measureCtx = null;

function wrapLines(text, font, maxW) {
  measureCtx.font = font;
  const words = String(text).split(/\s+/);
  const lines = [];
  let cur = "";
  for (const w of words) {
    const t = cur ? cur + " " + w : w;
    if (measureCtx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; }
    else cur = t;
  }
  if (cur) lines.push(cur);
  return lines.slice(0, 4);
}

function spawnBubble(ev) {
  let text = String(ev.text || "");
  if (text.length > 90) text = text.slice(0, 89) + "…";
  const radio = ev.type === "radio";
  if (radio) text = "📻 " + text;
  const lines = wrapLines(text, "11px sans-serif", 170);
  const key = radio ? null : ev.agent;
  state.bubbles = state.bubbles.filter((b) =>
    radio ? !b.radio : b.agent !== key);
  state.bubbles.push({
    agent: radio ? null : ev.agent,
    loc: radio ? (ev.location || radioLocation()) : null,
    lines, radio, born: performance.now(),
  });
}
function radioLocation() {
  for (const name in state.layout) if (state.layout[name].radio) return name;
  return null;
}

/* =====================================================================
   TRANSCRIPT FEED
===================================================================== */
const feed = $("feed");

function eventLine(ev) {
  const div = document.createElement("div");
  div.className = "ev " + esc(ev.type || "action");
  const who = ev.type === "radio" ? "Radio" : (ev.type === "gossip" ? firstName(ev.agent) + " → " + ((state.snap && state.snap.town) || "Town") + "_Gossip" : (ev.type === "text" && ev.target ? firstName(ev.agent) + " → " + firstName(ev.target) : (ev.agent ? firstName(ev.agent) : "")));
  let text = ev.text || "";
  if (ev.type === "leave") {
    text = text ? "heads to " + text : "heads out of " + (ev.location || "?");
  } else if (!text && ev.type === "arrive") {
    text = "arrives at " + (ev.location || "?");
  }
  const prefix = ev.type === "radio" ? "📻 " : (ev.type === "text" ? "📱 " : (ev.type === "gossip" ? "📢 " : ""));
  div.innerHTML =
    '<span class="t">' + esc(ev.sim_time || "") + "</span>" +
    (who ? '<span class="who">' + esc(who) + ":</span> " : "") +
    prefix + esc(text);
  return div;
}

function appendEvents(evs) {
  if (!evs.length) return;
  const frag = document.createDocumentFragment();
  for (const ev of evs) frag.appendChild(eventLine(ev));
  feed.appendChild(frag);
  while (feed.children.length > 300) feed.removeChild(feed.firstChild);
}

feed.addEventListener("mouseenter", () => { state.feedHover = true; });
feed.addEventListener("mouseleave", () => { state.feedHover = false; });
$("pinBtn").addEventListener("click", () => {
  state.pinned = !state.pinned;
  $("pinBtn").className = state.pinned ? "on" : "";
  $("pinBtn").textContent = state.pinned ? "pinned ▾" : "unpinned";
});

// Reading-pace auto-scroll: glide toward the newest line at ~45px/s so new
// text stays readable as it arrives; catch up proportionally faster if the
// feed has fallen far behind. Hovering pauses the glide; unpin disables it.
let _glideLast = 0;
function glideTick(ts) {
  const dt = _glideLast ? Math.min((ts - _glideLast) / 1000, 0.1) : 0.016;
  _glideLast = ts;
  if (state.pinned && !state.feedHover) {
    const target = feed.scrollHeight - feed.clientHeight;
    const dist = target - feed.scrollTop;
    if (dist > 0.5) {
      const speed = Math.max(45, dist * 0.9);   // px per second
      feed.scrollTop = Math.min(target, feed.scrollTop + speed * dt);
    }
  }
  requestAnimationFrame(glideTick);
}
requestAnimationFrame(glideTick);

/* =====================================================================
   WEBSOCKET
===================================================================== */
let ws = null, backoff = 500;

function connect() {
  const proto = location.protocol === "https:" ? "wss://" : "ws://";
  try { ws = new WebSocket(proto + location.host + "/ws"); }
  catch (e) { scheduleReconnect(); return; }
  ws.onopen = () => { backoff = 500; setConn(true); };
  ws.onmessage = (msg) => {
    let snap;
    try { snap = JSON.parse(msg.data); } catch (e) { return; }
    handleSnapshot(snap);
  };
  ws.onclose = () => { setConn(false); scheduleReconnect(); };
  ws.onerror = () => { try { ws.close(); } catch (e) {} };
}
function scheduleReconnect() {
  setTimeout(connect, backoff);
  backoff = Math.min(backoff * 2, 8000);
}
function setConn(ok) {
  const el = $("conn");
  el.className = "badge" + (ok ? " ok" : "");
  el.textContent = ok ? "connected" : "reconnecting";
}

function handleSnapshot(snap) {
  const firstSnap = !state.snap;
  state.snap = snap;
  if (firstSnap) $("waiting").style.display = "none";

  state.projects = snap.projects || null;
  const sig = layoutSignature(snap.locations || []);
  if (sig !== state.layoutSig) {
    state.layout = buildLayout(snap.locations || []);
    state.layoutSig = sig;
  }

  updateHeader(snap);
  updateAgentTargets(snap);

  const fresh = (snap.events || []).filter((e) => e.seq > state.lastSeq);
  if (fresh.length) {
    state.lastSeq = fresh[fresh.length - 1].seq;
    state.events.push(...fresh);
    if (state.events.length > 300) state.events.splice(0, state.events.length - 300);
    appendEvents(fresh);
    for (const ev of fresh) {
      if ((ev.type === "say" || ev.type === "radio") && ev.tick >= snap.tick - 2) {
        spawnBubble(ev);
      }
    }
  }
}

function updateHeader(snap) {
  const clock = $("clock");
  clock.textContent = "Day " + snap.day + " — " + snap.hhmm;
  if (snap.town) { document.title = snap.town + " — Observatory"; const h1 = document.querySelector("header h1"); if (h1 && h1.textContent !== snap.town.toUpperCase()) h1.textContent = snap.town.toUpperCase(); }
  clock.className = snap.paused ? "paused" : "";
  $("daynight").textContent = snap.is_night ? "🌙" : "☀️";
  const mb = $("modebadge");
  mb.textContent = snap.mock ? "mock" : "live";
  mb.className = "badge " + (snap.mock ? "mock" : "live");
  $("seedbadge").textContent = "seed " + (snap.seed == null ? "—" : snap.seed);
  const pb = $("pauseBtn");
  pb.textContent = snap.paused ? "Resume" : "Pause";
  pb.className = snap.paused ? "paused" : "";
}

$("pauseBtn").addEventListener("click", async () => {
  try {
    const r = await fetch("/api/control/pause", { method: "POST" });
    const j = await r.json();
    if (state.snap) { state.snap.paused = j.paused; updateHeader(state.snap); }
  } catch (e) {}
});

/* =====================================================================
   INSPECTOR
===================================================================== */
function openInspector(name) {
  closeInspector();
  state.insp.open = true;
  state.insp.name = name;
  $("inspName").textContent = name;
  $("inspJob").textContent = "";
  $("inspbody").innerHTML = '<div class="kv">loading…</div>';
  $("inspector").className = "open";
  fetchInspector();
  state.insp.timer = setInterval(fetchInspector, 2000);
}
function closeInspector() {
  state.insp.open = false;
  if (state.insp.timer) { clearInterval(state.insp.timer); state.insp.timer = null; }
  $("inspector").className = "";
}
$("inspClose").addEventListener("click", closeInspector);

async function fetchInspector() {
  const name = state.insp.name;
  if (!name) return;
  let d;
  try {
    const r = await fetch("/api/agent/" + encodeURIComponent(name));
    if (!r.ok) return;
    d = await r.json();
  } catch (e) { return; }
  if (!state.insp.open || state.insp.name !== name) return;
  renderInspector(d);
}

function needBar(label, val, color) {
  const v = Math.max(0, Math.min(100, Number(val) || 0));
  return '<div class="needbar"><span class="nlabel">' + esc(label) + "</span>" +
    '<span class="track"><span class="fill" style="width:' + v.toFixed(0) +
    "%;background:" + color + '"></span></span>' +
    '<span class="nval">' + v.toFixed(0) + "</span></div>";
}

function renderInspector(d) {
  // preserve open/closed state of the <details> and scroll of their <pre>s
  const openStates = {};
  $("inspbody").querySelectorAll("details").forEach((el) => {
    openStates[el.dataset.k] = { open: el.open, scroll: el.querySelector("pre").scrollTop };
  });
  const bodyScroll = $("inspbody").scrollTop;

  $("inspName").textContent = d.name;
  $("inspJob").textContent = d.job || "";

  let h = "";
  h += '<div class="tagrow">';
  h += '<span class="tag model">' + esc(d.model || "?") + "</span>";
  if (d.possessed) h += '<span class="tag possessed">possessed</span>';
  if (d.asleep) h += '<span class="tag">asleep</span>';
  if (d.activity) h += '<span class="tag">' + esc(d.activity) + "</span>";
  h += "</div>";

  h += '<div class="kv">at <b>' + esc(d.location || "?") + "</b> · home <b>" +
       esc(d.home || "—") + "</b> · works at <b>" + esc(d.workplace || "—") + "</b></div>";
  h += '<div class="kv">money <b>$' + Number(d.money || 0).toFixed(2) + "</b></div>";

  const needs = d.needs || {};
  h += '<div class="sect">Needs</div>';
  h += needBar("energy", needs.energy, "#7dc4a0");
  h += needBar("fullness", needs.fullness, "#e0a458");

  h += '<div class="sect">Character</div>';
  h += '<div class="tagrow">';
  for (const t of d.traits || []) h += '<span class="tag">' + esc(t) + "</span>";
  h += "</div>";
  if (d.quirk) h += '<div class="kv">quirk: <b>' + esc(d.quirk) + "</b></div>";
  if (d.goal) h += '<div class="kv">goal: <b>' + esc(d.goal) + "</b></div>";
  if (d.last_reason) h += '<div class="kv">thinking: <i>' + esc(d.last_reason) + "</i></div>";

  const rels = d.relationships || {};
  const relNames = Object.keys(rels).sort((a, b) => rels[b] - rels[a]);
  if (relNames.length) {
    h += '<div class="sect">Relationships</div>';
    for (const rn of relNames) {
      h += '<div class="rel"><b>' + esc(rn) + "</b><span>" + esc(rels[rn]) + "</span></div>";
    }
  }

  const mems = d.recent_memories || [];
  h += '<div class="sect">Memories (' + (d.memory_count || 0) + ")</div>";
  for (const m of mems.slice().reverse()) {
    h += '<div class="mem"><span class="mk ' + esc(m.kind || "") + '">' +
         esc(m.kind || "mem") + '</span><span class="imp">imp ' +
         esc(m.importance != null ? m.importance : "?") + "</span>" +
         '<span class="t" style="color:var(--ink-dimmer);font-size:10px;margin-right:6px">' +
         "d" + esc(m.day) + " " + esc(m.sim_time || "") + "</span>" +
         esc(m.text || "") + "</div>";
  }

  h += '<details data-k="prompt"><summary>last prompt</summary><pre>' +
       esc(d.last_prompt || "(none)") + "</pre></details>";
  h += '<details data-k="reply"><summary>last raw reply</summary><pre>' +
       esc(d.last_reply || "(none)") + "</pre></details>";

  $("inspbody").innerHTML = h;
  $("inspbody").querySelectorAll("details").forEach((el) => {
    const st = openStates[el.dataset.k];
    if (st) { el.open = st.open; el.querySelector("pre").scrollTop = st.scroll; }
  });
  $("inspbody").scrollTop = bodyScroll;
}

/* =====================================================================
   MAP RENDERING
===================================================================== */
const canvas = $("map");
const ctx = canvas.getContext("2d");
measureCtx = ctx;
let view = { scale: 1, ox: 0, oy: 0, dpr: 1, cssW: 0, cssH: 0 };

function resize() {
  const rect = canvas.parentElement.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  view.cssW = rect.width; view.cssH = rect.height; view.dpr = dpr;
  canvas.width = Math.max(1, Math.round(rect.width * dpr));
  canvas.height = Math.max(1, Math.round(rect.height * dpr));
  view.scale = Math.min(rect.width / W, rect.height / H);
  view.ox = (rect.width - W * view.scale) / 2;
  view.oy = (rect.height - H * view.scale) / 2;
}
window.addEventListener("resize", resize);

function drawGround(night) {
  ctx.fillStyle = night ? "#151a24" : "#1b212b";
  ctx.fillRect(-2000, -2000, 5000, 5000);
  // subtle grid
  ctx.strokeStyle = night ? "rgba(60,72,95,0.10)" : "rgba(90,105,130,0.10)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = 0; x <= W; x += 50) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = 0; y <= H; y += 50) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();
  // scattered ground specks for texture
  ctx.fillStyle = night ? "rgba(70,85,110,0.08)" : "rgba(110,125,150,0.08)";
  for (let i = 0; i < 90; i++) {
    const x = ((i * 127.3) % W), y = ((i * 311.7) % H);
    ctx.fillRect(x, y, 2.2, 2.2);
  }
}

function drawPaths() {
  const plaza = state.layout["the plaza"];
  if (!plaza) return;
  const cx = plaza.x + plaza.w / 2, cy = plaza.y + plaza.h / 2;
  ctx.strokeStyle = "rgba(150,140,120,0.10)";
  ctx.lineWidth = 10;
  ctx.lineCap = "round";
  for (const name in state.layout) {
    const b = state.layout[name];
    if (b === plaza || b.isHome) continue;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(b.x + b.w / 2, b.y + b.h / 2);
    ctx.stroke();
  }
  // one lane along the homes row
  const homes = Object.keys(state.layout).filter((n) => state.layout[n].isHome);
  if (homes.length) {
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx, 545);
    ctx.moveTo(60, 545);
    ctx.lineTo(W - 60, 545);
    ctx.stroke();
  }
}

function occupantsOf(locName) {
  let n = 0;
  for (const d of state.agents.values()) if (d.loc === locName) n++;
  return n;
}

function drawBuilding(name, b, night) {
  const occupied = occupantsOf(name) > 0;
  // shadow
  ctx.fillStyle = "rgba(0,0,0,0.30)";
  rr(ctx, b.x + 5, b.y + 7, b.w, b.h, 12);
  ctx.fill();
  // warm glow behind occupied buildings at night
  if (night && occupied) {
    const g = ctx.createRadialGradient(
      b.x + b.w / 2, b.y + b.h / 2, 8,
      b.x + b.w / 2, b.y + b.h / 2, Math.max(b.w, b.h) * 0.85);
    g.addColorStop(0, "rgba(224,164,88,0.16)");
    g.addColorStop(1, "rgba(224,164,88,0)");
    ctx.fillStyle = g;
    ctx.fillRect(b.x - 60, b.y - 60, b.w + 120, b.h + 120);
  }
  // body
  const grad = ctx.createLinearGradient(b.x, b.y, b.x, b.y + b.h);
  if (b.isHome) {
    grad.addColorStop(0, night ? "#2a2c34" : "#303540");
    grad.addColorStop(1, night ? "#22242c" : "#272c36");
  } else {
    grad.addColorStop(0, night ? "#272b35" : "#2d3441");
    grad.addColorStop(1, night ? "#1f232c" : "#242a35");
  }
  ctx.fillStyle = grad;
  rr(ctx, b.x, b.y, b.w, b.h, b.isHome ? 8 : 12);
  ctx.fill();
  ctx.strokeStyle = night ? "#39404d" : "#414b5b";
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // cottage roof
  if (b.isHome) {
    ctx.fillStyle = night ? "#343945" : "#3c4353";
    ctx.beginPath();
    ctx.moveTo(b.x - 5, b.y + 2);
    ctx.lineTo(b.x + b.w / 2, b.y - 16);
    ctx.lineTo(b.x + b.w + 5, b.y + 2);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = night ? "#454c5c" : "#4d576b";
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // windows
  const lit = night && occupied;
  const winFill = lit ? "rgba(240,190,110,0.85)" : (night ? "#1a1e26" : "#3a4250");
  const wy = b.y + b.h - 24;
  const nw = b.isHome ? 2 : 3;
  for (let i = 0; i < nw; i++) {
    const wx = b.x + b.w * ((i + 1) / (nw + 1)) - 6;
    if (lit) {
      ctx.save();
      ctx.shadowColor = "rgba(240,190,110,0.9)";
      ctx.shadowBlur = 10;
      ctx.fillStyle = winFill;
      ctx.fillRect(wx, wy, 12, 10);
      ctx.restore();
    } else {
      ctx.fillStyle = winFill;
      ctx.fillRect(wx, wy, 12, 10);
    }
  }

  // radio marker
  if (b.radio) {
    ctx.font = "12px sans-serif";
    ctx.textAlign = "right";
    ctx.fillText("📻", b.x + b.w - 8, b.y + 18);
  }

  // built things & works-in-progress — monuments get proper plaques,
  // laid out in wrapping rows that stay inside the building
  if (state.projects) {
    const startX = b.x + b.w - (b.radio ? 30 : 10);
    const minX = b.x + 8;
    let px = startX, row = 0, hidden = 0;
    const rowY = () => b.y + 4 + row * 26;
    const advance = (w) => {
      px -= w;
      if (px - 30 < minX && row === 0) { row = 1; px = startX; }
      else if (px - 30 < minX && row === 1) { row = 2; }
    };
    for (const p of state.projects) {
      if (p.site !== name) continue;
      if (row >= 2) { if (p.complete || p.done > 0) hidden++; continue; }
      if (p.complete) {
        // plaque chip: warm border, dark fill, bold icon
        ctx.fillStyle = "rgba(38,33,22,0.95)";
        ctx.strokeStyle = "rgba(224,164,88,0.75)";
        ctx.lineWidth = 1;
        rr(ctx, px - 24, rowY(), 24, 22, 6);
        ctx.fill();
        ctx.stroke();
        ctx.font = "15px sans-serif";
        ctx.textAlign = "center";
        ctx.fillStyle = "#f0c98a";
        ctx.fillText(p.icon || "🏛", px - 12, rowY() + 17);
        advance(30);
      } else if (p.done > 0) {
        const label = "🔨" + Math.round(100 * p.done / p.work) + "%";
        ctx.font = "700 12px sans-serif";
        const lw = ctx.measureText(label).width + 14;
        ctx.fillStyle = "rgba(20,40,32,0.97)";
        ctx.strokeStyle = "rgba(127,240,200,0.9)";
        ctx.lineWidth = 1.5;
        rr(ctx, px - lw, rowY(), lw, 21, 6);
        ctx.fill();
        ctx.stroke();
        ctx.textAlign = "center";
        ctx.fillStyle = "#ffffff";
        ctx.fillText(label, px - lw / 2, rowY() + 15);
        advance(lw + 6);
      }
    }
    if (hidden > 0) {
      ctx.font = "700 10px sans-serif";
      ctx.fillStyle = "#c9b48a";
      ctx.textAlign = "right";
      ctx.fillText("+" + hidden + " more", b.x + b.w - 10, b.y + 58);
    }
  }

  // label
  ctx.fillStyle = night ? "#8a94a2" : "#aeb7c2";
  ctx.font = (b.isHome ? "600 10.5px" : "600 12px") + " sans-serif";
  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";
  ctx.fillText(b.label, b.x + 10, b.y + (b.isHome ? 15 : 18));
}

function drawAgent(dot, name, now, night) {
  const r = 7;
  const asleep = dot.asleep;
  ctx.save();
  if (asleep) ctx.globalAlpha = 0.45;
  // soft shadow under dot
  ctx.fillStyle = "rgba(0,0,0,0.35)";
  ctx.beginPath();
  ctx.ellipse(dot.x, dot.y + r * 0.9, r * 0.9, r * 0.4, 0, 0, Math.PI * 2);
  ctx.fill();
  // dot
  const col = "hsl(" + dot.hue + ", 55%, " + (night ? 60 : 66) + "%)";
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.arc(dot.x, dot.y, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.35)";
  ctx.lineWidth = 1.2;
  ctx.stroke();
  // name
  ctx.fillStyle = asleep ? "rgba(200,208,218,0.8)" : "#cfd6de";
  ctx.font = "10px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText(firstName(name), dot.x, dot.y + r + 11);
  ctx.restore();
  // z for sleepers (drawn at full alpha, gently bobbing)
  if (asleep) {
    const bob = Math.sin(now / 600 + dot.hue) * 2;
    ctx.fillStyle = "rgba(181,143,216,0.85)";
    ctx.font = "italic 600 11px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("z", dot.x + 8, dot.y - 10 + bob);
    ctx.font = "italic 600 8px sans-serif";
    ctx.fillText("z", dot.x + 14, dot.y - 17 + bob * 0.6);
  }
}

function drawBubbles(now) {
  // Two passes: measure & place with collision avoidance (newer bubbles get
  // pushed upward until they don't overlap older ones), then draw.
  const placed = [];
  ctx.save();
  ctx.font = "11px sans-serif";
  for (const bub of state.bubbles) {
    let ax, ay;
    if (bub.agent) {
      const dot = state.agents.get(bub.agent);
      if (!dot) continue;
      ax = dot.x; ay = dot.y - 14;
    } else if (bub.loc && state.layout[bub.loc]) {
      const b = state.layout[bub.loc];
      ax = b.x + b.w / 2; ay = b.y - 6;
    } else continue;

    const age = now - bub.born;
    const alpha = age > BUBBLE_LIFE - BUBBLE_FADE
      ? Math.max(0, (BUBBLE_LIFE - age) / BUBBLE_FADE) : 1;
    if (alpha <= 0) continue;

    let tw = 0;
    for (const ln of bub.lines) tw = Math.max(tw, ctx.measureText(ln).width);
    const pad = 8, lh = 14;
    const bw = tw + pad * 2;
    const bh = bub.lines.length * lh + pad * 2 - 3;
    let bx = ax - bw / 2, by = ay - bh - 10;
    bx = Math.max(6, Math.min(W - bw - 6, bx));
    by = Math.max(6, by);

    // push up until clear of every already-placed bubble
    let guard = 0;
    let moved = true;
    while (moved && guard++ < 40) {
      moved = false;
      for (const p of placed) {
        const overlapX = bx < p.bx + p.bw + 4 && bx + bw + 4 > p.bx;
        const overlapY = by < p.by + p.bh + 4 && by + bh + 4 > p.by;
        if (overlapX && overlapY) {
          by = p.by - bh - 8;
          moved = true;
        }
      }
    }
    by = Math.max(4, by);
    placed.push({ bub, ax, ay, bx, by, bw, bh, pad, lh, alpha });
  }

  for (const p of placed) {
    const { bub, ax, bx, by, bw, bh, pad, lh, alpha } = p;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = bub.radio ? "rgba(58,47,30,0.95)" : "rgba(240,243,247,0.95)";
    ctx.strokeStyle = bub.radio ? "rgba(224,164,88,0.8)" : "rgba(255,255,255,0.25)";
    ctx.lineWidth = 1;
    rr(ctx, bx, by, bw, bh, 8);
    ctx.fill();
    ctx.stroke();
    // tail (clamped to the bubble's width so it always connects)
    const tx = Math.max(bx + 10, Math.min(bx + bw - 10, ax));
    ctx.beginPath();
    ctx.moveTo(tx - 5, by + bh - 0.5);
    ctx.lineTo(tx + 5, by + bh - 0.5);
    ctx.lineTo(tx, by + bh + 7);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = bub.radio ? "#f0c98a" : "#1c2129";
    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";
    bub.lines.forEach((ln, i) => {
      ctx.fillText(ln, bx + pad, by + pad + 10 + i * lh);
    });
  }
  ctx.restore();
}

function render(now) {
  requestAnimationFrame(render);
  if (!view.cssW) resize();
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  ctx.fillStyle = "#14161c";
  ctx.fillRect(0, 0, view.cssW, view.cssH);
  if (!state.snap || !state.layout) return;
  const night = !!state.snap.is_night;

  ctx.setTransform(view.dpr * view.scale, 0, 0, view.dpr * view.scale,
                   view.dpr * view.ox, view.dpr * view.oy);
  drawGround(night);
  drawPaths();
  for (const name in state.layout) drawBuilding(name, state.layout[name], night);

  // night wash over the whole map (under agents/bubbles, over buildings)
  if (night) {
    ctx.fillStyle = "rgba(8, 12, 30, 0.28)";
    ctx.fillRect(-2000, -2000, 5000, 5000);
  }

  tickAgentPositions(now);
  for (const [name, dot] of state.agents) drawAgent(dot, name, now, night);

  state.bubbles = state.bubbles.filter((b) => now - b.born < BUBBLE_LIFE);
  drawBubbles(now);
}

/* ------------- click-to-inspect + hover cursor ------------- */
function agentAt(px, py) {
  const wx = (px - view.ox) / view.scale;
  const wy = (py - view.oy) / view.scale;
  let best = null, bestD = 14;   // world-unit hit radius
  for (const [name, dot] of state.agents) {
    const d = Math.hypot(dot.x - wx, dot.y - wy);
    if (d < bestD) { bestD = d; best = name; }
  }
  return best;
}
canvas.addEventListener("click", (e) => {
  const rect = canvas.getBoundingClientRect();
  const name = agentAt(e.clientX - rect.left, e.clientY - rect.top);
  if (name) openInspector(name);
});
canvas.addEventListener("mousemove", (e) => {
  const rect = canvas.getBoundingClientRect();
  canvas.style.cursor =
    agentAt(e.clientX - rect.left, e.clientY - rect.top) ? "pointer" : "default";
});

/* =====================================================================
   BOOT
===================================================================== */
resize();
connect();
requestAnimationFrame(render);
</script>
